# Railway deployment configuration.
#
# Railway will use Nixpacks to detect Python and pip install requirements.txt.
# After build, the start command runs migrations + seed + uvicorn. The seed
# is idempotent (Session 6) so it's safe on every release.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python -m alembic upgrade head && python -m app.cli seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "api"
