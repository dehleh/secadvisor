# Cross-framework control mappings.
#
# strength values:
#   equivalent  - the controls assess substantially the same thing; evidence
#                 for one can be reused with minor wording changes
#   partial     - significant overlap but with framework-specific gaps;
#                 evidence may need supplementation
#   related     - addresses a similar concern from a different angle;
#                 reference only, evidence does not transfer
#
# Mappings are directional in the model but conceptually symmetric for
# equivalent. We seed both directions for equivalent and partial mappings
# so propagation works regardless of which side a user submits evidence for.

mappings:
  # ----- SOC 2 CC6.1 (Logical access) <-> peers -----
  - source_framework: soc2
    source_code: CC6.1
    target_framework: ndpa
    target_code: SEC_24
    strength: equivalent
    notes: Both require appropriate technical and organisational security measures.

  - source_framework: ndpa
    source_code: SEC_24
    target_framework: soc2
    target_code: CC6.1
    strength: equivalent

  - source_framework: soc2
    source_code: CC6.1
    target_framework: iso27001
    target_code: A.5.15
    strength: equivalent
    notes: ISO A.5.15 is the access control policy; SOC 2 CC6.1 is its operational expression.

  - source_framework: iso27001
    source_code: A.5.15
    target_framework: soc2
    target_code: CC6.1
    strength: equivalent

  - source_framework: soc2
    source_code: CC6.1
    target_framework: cbn_cyber
    target_code: "4.2"
    strength: equivalent
    notes: CBN 4.2 explicitly requires MFA, RBAC, and least privilege — same as CC6.1.

  - source_framework: cbn_cyber
    source_code: "4.2"
    target_framework: soc2
    target_code: CC6.1
    strength: equivalent

