snippets:
  - id: iso27001.overview
    title: ISO 27001 — Overview and value for African startups
    content: >
      ISO 27001 is the international standard for Information Security
      Management Systems. Unlike SOC 2 which produces an attestation
      report read by enterprise customers, ISO 27001 produces a
      certificate that is widely recognised globally — particularly
      important when selling to European enterprises, who often prefer
      ISO 27001 over SOC 2. The 2022 revision restructured Annex A
      controls into four themes (Organizational, People, Physical,
      Technological) with 93 controls total. Many African startups
      pursue both SOC 2 (for US customers) and ISO 27001 (for EU /
      global) — the underlying controls overlap heavily.
    framework_codes: [iso27001]
    tags: [overview, certification, comparison]

  - id: iso27001.isms_scope
    title: ISO 27001 — ISMS scope definition
    content: >
      The first deliverable in an ISO 27001 programme is the Information
      Security Management System scope — defining what the ISMS covers
      (which products, which infrastructure, which staff, which
      locations). A tightly-scoped ISMS is faster to implement and
      certify; a broadly-scoped ISMS provides more market value but
      takes longer. Most early-stage startups scope to "the production
      SaaS service and supporting business operations" excluding,
      e.g., personal devices used for non-work purposes.
    framework_codes: [iso27001]
    tags: [scope, isms, planning]

  - id: iso27001.statement_of_applicability
    title: ISO 27001 — Statement of Applicability
    content: >
      The Statement of Applicability (SoA) is a foundational ISO 27001
      artefact: a document listing each of the 93 Annex A controls with
      a yes/no decision on applicability and a justification. Controls
      determined inapplicable (e.g. physical controls inherited from a
      cloud provider) must be justified — typically with reference to
      the cloud provider's own ISO 27001 certificate. The SoA is one of
      the first documents an auditor reads.
    framework_codes: [iso27001]
    tags: [soa, statement_of_applicability, audit_prep]

  - id: iso27001.risk_assessment
    title: ISO 27001 — Risk assessment methodology
    content: >
      ISO 27001 requires a documented risk assessment methodology applied
      consistently. The classic approach: identify assets, identify
      threats and vulnerabilities to each asset, score likelihood and
      impact, calculate risk, and select treatment (mitigate, transfer,
      avoid, accept). The output is a risk treatment plan tied to the
      Annex A controls being implemented. Auditors will check that risk
      assessment outputs actually drove control selection — not the
      other way around.
    framework_codes: [iso27001]
    tags: [risk_assessment, methodology, treatment_plan]
